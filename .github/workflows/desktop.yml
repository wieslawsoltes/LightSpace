name: Desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: python scripts/fetch-assets.py
        env:
          LIGHTSPACE_NO_DEMO_PHOTOS: '1'
      - run: dotnet build src/LightSpace.App -c Release -f net10.0-desktop -p:LightSpaceDesktopOnly=true
