name: Slider explicit-bounds diagnostic
on:
  push:
    branches: ['diagnostics/slider-bounds']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: LightSpace-browser
          run-id: 36408386674
          github-token: ${{ github.token }}
          path: baseline
      - name: Verify unchanged original application
        run: jq -e '.commit == "fe1df0bb9ffdd99a8e05abe68f9a51b582ccbfd7"' baseline/build-info.json
      - name: Capture a checked Wasm fault rather than a browser signal
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          cat > playwright.bounds.config.mjs <<'JS'
          import config from './playwright.config.mjs';
          config.use.launchOptions.args.push('--js-flags=--wasm-enforce-bounds-checks');
          export default config;
          JS
          mkdir -p artifacts
          python3 scripts/serve-site.py --directory baseline --port 4173 > artifacts/baseline-server.log 2>&1 &
          set -o pipefail
          DEBUG=pw:browser npx playwright test slider-stability.spec.mjs --config=playwright.bounds.config.mjs 2>&1 | tee artifacts/baseline-probe.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LightSpace-slider-explicit-bounds
          path: artifacts
