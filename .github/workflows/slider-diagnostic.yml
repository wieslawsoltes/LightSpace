name: Managed equality isolation
on:
  push:
    branches: ['diagnostics/slider-bounds']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the isolated managed startup probe
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
          dotnet publish src/LightSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/LightSpace/ -p:WasmEmitSymbolMap=true
          python3 scripts/collect-site.py artifacts/publish artifacts/site
      - name: Exercise equality without rendering
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          cat > playwright.bounds.config.mjs <<'JS'
          import config from './playwright.config.mjs';
          config.use.launchOptions.args.push('--js-flags=--wasm-enforce-bounds-checks');
          export default config;
          JS
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          set -o pipefail
          npx playwright test model-equality-probe.spec.mjs --config=playwright.bounds.config.mjs 2>&1 | tee artifacts/probe.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LightSpace-managed-equality-probe
          path: |
            artifacts/model-probe.json
            artifacts/probe.log
            artifacts/browser-results.xml
            src/LightSpace.App/obj/**/*symbols*
