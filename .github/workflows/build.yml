name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/LightSpace.Engine.Tests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightSpace-engine-validation
          path: artifacts/engine
          if-no-files-found: ignore
  browser:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install browser toolchain and assets
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
      - name: Publish real Uno WebAssembly
        run: |
          dotnet publish src/LightSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/LightSpace/
          python3 scripts/collect-site.py artifacts/publish artifacts/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightSpace-browser
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightSpace-assets
          path: artifacts/demo-assets.json
          if-no-files-found: ignore
