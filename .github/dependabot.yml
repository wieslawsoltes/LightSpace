version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      skia-abi:
        patterns: ['SkiaSharp*', 'HarfBuzzSharp*', 'Uno.WinUI*']
